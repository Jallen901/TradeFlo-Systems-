<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0F0F1A"/>
  <!-- Stripe texture -->
  <defs>
    <pattern id="stripe" width="56.57" height="56.57" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="40" height="56.57" fill="none"/>
      <rect x="40" width="1" height="56.57" fill="rgba(37,99,235,0.06)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#stripe)"/>
  <!-- Left blue accent bar -->
  <rect x="80" y="160" width="4" height="310" fill="#2563EB"/>
  <!-- TF Monogram -->
  <text x="108" y="330" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" fill="#F5F2EC" letter-spacing="-6">T</text>
  <text x="212" y="330" font-family="Arial Black, sans-serif" font-weight="900" font-size="180" fill="#2563EB" letter-spacing="-6">F</text>
  <!-- Divider -->
  <rect x="370" y="175" width="2" height="280" fill="#ffffff" fill-opacity="0.12"/>
  <!-- Brand name -->
  <text x="410" y="270" font-family="Arial Black, sans-serif" font-weight="900" font-size="80" fill="#F5F2EC" letter-spacing="1">TRADEFLO</text>
  <text x="413" y="325" font-family="Arial, sans-serif" font-weight="400" font-size="30" fill="#ffffff" fill-opacity="0.35" letter-spacing="16">SYSTEMS</text>
  <!-- Divider line -->
  <rect x="410" y="355" width="70" height="3" fill="#2563EB"/>
  <!-- Tagline -->
  <text x="410" y="415" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" fill-opacity="0.55" letter-spacing="2">BUILT FOR HARD WORK. ENGINEERED FOR GROWTH.</text>
  <!-- Headline -->
  <text x="410" y="465" font-family="Arial Black, sans-serif" font-weight="900" font-size="30" fill="#F5F2EC">You Do The Work. We Get The Calls.</text>
  <!-- URL -->
  <text x="410" y="520" font-family="Arial, sans-serif" font-size="20" fill="#2563EB" letter-spacing="1">tradeflosystems.com</text>
</svg>
